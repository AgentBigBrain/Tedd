name: Manual Python preview checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-prerelease:
    name: Experimental / Python 3.15-dev
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up prerelease Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15-dev"
          check-latest: true

      - name: Run dependency-free release verification
        run: ./scripts/verify-release.sh --expected-python "3.15"
