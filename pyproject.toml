    "tests/knowledge_graph/test_knowledge_graph_v4_cli_dispatch.py",
    "tests/knowledge_graph/test_knowledge_graph_v4_feed_coordination.py",
    "tests/knowledge_graph/test_knowledge_graph_v4_migrations.py",
    "tests/knowledge_graph/test_knowledge_graph_v4_queries.py",
    "tests/knowledge_graph/test_knowledge_graph_v4_read_snapshot.py",
    "tests/knowledge_graph/test_knowledge_graph_v4_registry.py",
    "tests/knowledge_graph/test_knowledge_graph_v4_service_boundaries.py",
    "tests/knowledge_graph/test_knowledge_graph_v4_transactions.py",
    "tests/support",
]
check_untyped_defs = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "tests.knowledge_graph.test_knowledge_graph_v4",
    "tests.knowledge_graph.test_knowledge_graph_v4_integration",
    "tests.support.graph_cases",
    "tests.tedd_profile.test_tedd_profile",
]
# These CLI/store integration harnesses intentionally preserve decoded JSON
# and dynamically loaded facade objects at their test boundaries. The rest of
# each large suite remains under the global mypy checks.
disallow_any_explicit = false
warn_return_any = false

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "scripts",
    "plugins/tedd/skills/tedd/scripts",
    "plugins/tedd/skills/obsidian-knowledge-graph/scripts",
]
omit = [
    "*/test_*.py",
    "*/benchmark_*.py",
]

[tool.coverage.report]
# The full isolated suite measured 70% branch coverage during the responsibility
# decomposition. Retain the established 55% cross-platform regression floor until
# the higher baseline is stable on every blocking operating system; raise it only
# with meaningful tests.
fail_under = 55
show_missing = true
skip_covered = true
